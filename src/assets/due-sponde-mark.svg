<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" aria-label="Due Sponde — two shores joined by an arch">
  <title>Due Sponde</title>
  <!-- dotted centre line -->
  <line x1="100" y1="48" x2="100" y2="200" stroke="#7a8363" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 10"/>
  <!-- blue arc from the left shore to the keystone -->
  <path d="M 40 140 A 60 85 0 0 1 100 55" fill="none" stroke="#2f6f93" stroke-width="15" stroke-linecap="round"/>
  <!-- terracotta arc from the right shore to the keystone -->
  <path d="M 100 55 A 60 85 0 0 1 160 140" fill="none" stroke="#b5533c" stroke-width="15" stroke-linecap="round"/>
  <!-- keystone -->
  <circle cx="100" cy="48" r="14" fill="#4a5a30"/>
  <!-- shores -->
  <circle cx="40" cy="220" r="8" fill="#2f6f93"/>
  <circle cx="160" cy="220" r="8" fill="#b5533c"/>
</svg>

# Railway deployment config for leoslectures.com.
# Nixpacks auto-detects Node 20 from engines in package.json and runs the npm scripts.
# Our 'build' script generates dist/; 'start' serves dist/ on $PORT with the zero-dep server.

[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/"
healthcheckTimeout = 10
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
